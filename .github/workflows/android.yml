name: Build ASTRO APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet g4f duckduckgo-search langdetect
          flet --version

      - name: Build APK with Flet
        run: |
          flet build apk --module-name app.py --yes --verbose

      - name: Show build output
        if: always()
        run: |
          echo "Checking APK output..."
          find build -type f \( -name "*.apk" -o -name "*.aab" \) -print || true

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-APK
          path: build/apk/*.apk
          if-no-files-found: error
