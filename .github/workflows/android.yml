name: Build ASTRO APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-APK
          path: build/
          if-no-files-found: warn
