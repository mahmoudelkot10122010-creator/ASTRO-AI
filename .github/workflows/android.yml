name: Build ASTRO APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==0.85.3" g4f duckduckgo-search

      - name: Show build environment
        run: |
          python --version
          flet --version
          flutter --version
          flutter doctor

      - name: Build APK
        run: |
          flet build apk --module-name app.py --yes --verbose

      - name: Show APK output
        if: always()
        run: |
          find build -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-APK
          path: build/apk/*.apk
          if-no-files-found: error
