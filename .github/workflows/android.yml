name: Diagnose ASTRO Flet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Diagnose Flet CLI
        shell: bash
        run: |
          uv run --with "flet>=0.85.3" flet --version --json
          echo "JSON_EXIT_CODE=$?"
          uv run --with "flet>=0.85.3" flet --version
          echo "VERSION_EXIT_CODE=$?"
